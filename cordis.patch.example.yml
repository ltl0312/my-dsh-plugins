# cordis.patch.example.yml
# DSH 宿主零侵入装配补丁模板（阶段六）：
# 将本文件内容合并至 GUI 宿主 Profile（如 profiles/web）的 cordis.patch.yml
# 即可挂载 tlmemory 插件（单一宿主自洽拓扑）。
#
# 更省事的方式：`dsh plugin --profile web add dsh-plugin-tlmemory`
# 会自动完成「装依赖 + 放行原生模块 + 写入下面的 insert 条目」三步。
#
# 单一宿主拓扑（推荐）：GUI 宿主同时承担
#   - 会话事件无感静默沉淀（turn/end 异步提炼写入 ~/.dsh/tlmemory.db）；
#   - 内嵌 127.0.0.1:4890 记忆看板服务（零配置自启：端口被前序 tlmemory 实例
#     占用时健康探测确认同名进程后自动复用；被无关进程占用时自动顺延端口）；
#   - 客户端插件注册（侧栏顶部一级入口 + 中心列整幅接管看板，与任务看板 / SSH 同规格）。
# 多宿主并存（旧拓扑）：第二个宿主启动时健康探测到前序 tlmemory 实例后会自动
# 复用之，两侧共用同一 SQLite 文件（WAL 多进程安全），无需任何手工开关。
- insert:
    - id: tlmemory-runtime
      name: "dsh-plugin-tlmemory"
      config:
        serverPort: 4890
        maxRecallCount: 5
        enableAutoReflection: true